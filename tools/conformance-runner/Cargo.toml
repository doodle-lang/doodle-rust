[package]
name = "conformance-runner"
description = "Runs the Doodle language conformance suite against doodle-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The GC-stress determinism-gate hook (D-M7-11): when enabled, the runner reads the
# `DOODLE_GC_STRESS` environment variable to latch every-safe-point collection on the instances it
# creates. Off by default (mirrors doodle-capi) so an ordinary conformance run never reads the
# environment; the gate job (`scripts/gc-stress-conformance.sh`) builds with it.
gc-stress = []

[dependencies]
doodle-core = { path = "../../crates/doodle-core" }
