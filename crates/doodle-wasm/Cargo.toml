[package]
name = "doodle-wasm"
description = "The Doodle engine compiled to WebAssembly via wasm-bindgen."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
doodle-core = { path = "../doodle-core" }
wasm-bindgen = "0.2"
# Building the debug observation reads (E§8.2/§8.3) as plain JS objects/arrays across the
# boundary — no serde, so no wasm-size cost beyond the bindings actually used.
js-sys = "0.3"
