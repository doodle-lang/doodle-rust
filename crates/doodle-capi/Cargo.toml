[package]
name = "doodle-capi"
description = "The Doodle engine's C ABI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The embedder guide (build/link recipe + the handle-ownership, string-validity, and
# invalid-call-reject contracts): part of the C-ABI distribution artifact (D-M7-10).
readme = "README.md"
publish = false

# A staticlib is the embedding-friendly form: the C host links the archive
# directly into its own binary (one artifact, nothing to locate at runtime, far
# less cross-platform loader variance than a dynamic library). The C smoke test
# links it statically. A cdylib would be added only if a dynamic-loading /
# plugin consumer needs one.
#
# `rlib` is added so the `extern "C"` functions are callable from Rust `#[test]`s
# (a staticlib crate hosts no test target) and, later, from `cargo miri test`
# (D-M7-11) — the unsafe FFI lives here (AD1), so this is where Miri must run.
[lib]
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[features]
# The GC-stress determinism-gate hook (D-M7-11): when enabled, `doodle_load` reads the
# `DOODLE_GC_STRESS` environment variable to latch every-safe-point collection. Off by default so
# the shipped library never reads the environment (a production embedder's behavior must not vary
# with an ambient variable); the gate job (`scripts/gc-stress-conformance.sh`) builds with it. The
# explicit `Instance::enable_gc_stress()` path is always available regardless of this feature.
gc-stress = []

[dependencies]
doodle-core = { path = "../doodle-core" }
