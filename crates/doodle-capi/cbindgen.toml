# The committed include/doodle.h is regenerated with a pinned cbindgen version
# (0.29.4), enforced by scripts/capi-header.sh and installed by the capi CI job,
# so the "regenerate produces no diff" gate is reproducible. Bump deliberately.
language = "C"
include_guard = "DOODLE_H"
cpp_compat = true
autogen_warning = "/* Auto-generated by cbindgen; regenerate with scripts/capi-header.sh --write. Do not edit by hand. */"

# The ABI contract version, distinct from the engine's semver (doodle_version()):
# major = a breaking change, minor = an additive one (a new function, a new enum
# variant, a reserved field put to use). A host compiles against these and checks
# doodle_abi_version() at load. See lib.rs (the freeze conventions).
after_includes = """

/* The C ABI contract version (distinct from the engine version). See doodle_abi_version(). */
#define DOODLE_ABI_VERSION_MAJOR 0
#define DOODLE_ABI_VERSION_MINOR 1
"""

# All public types are named `Doodle*` and functions `doodle_*` in the Rust source,
# so no export prefix is added (that would double-prefix). Enum constants ARE
# name-prefixed (`DoodleStatus_Ok`, not a bare `Ok`) so they cannot collide with a
# host's macros/typedefs in the global C namespace.
[enum]
prefix_with_name = true

[export]
# Emit the opaque instance handle even though no field is public (it appears only
# behind a pointer in the function signatures).
include = ["DoodleInstance"]
