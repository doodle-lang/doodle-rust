name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `cargo test --workspace` on the three host platforms, plus a wasm32 build
# check.  The pinned toolchain -- channel, rustfmt/clippy components, and the
# wasm32-unknown-unknown target -- all come from rust-toolchain.toml: the warm
# step's argument-free `rustup toolchain install` reads that file and installs
# exactly what it declares, so nothing is pinned here.  Keeping the warm step a
# single argument-free command makes it behave identically under the default
# shells (bash on Linux/macOS, PowerShell on Windows).
#
# Deferred per implementation-plan AD8: Node-executed wasm tests land with the
# JS facade at M3, and a Miri job at M2a once doodle-core has nontrivial code.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: cargo test
        run: cargo test --workspace

  wasm-check:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: cargo check (wasm32)
        run: cargo check --workspace --target wasm32-unknown-unknown

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: conformance runner
        run: cargo run --quiet --package conformance-runner

  wasm-size:
    name: wasm size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: Install binaryen and brotli
        run: sudo apt-get update && sudo apt-get install -y binaryen brotli
      - name: Install wasm-bindgen-cli (version matched to the crate)
        # Read the locked wasm-bindgen version from Cargo.lock so the CLI always
        # matches the crate (wasm-bindgen errors loudly on a version mismatch).
        run: |
          ver=$(awk '/^name = "wasm-bindgen"$/{f=1} f && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          [ -n "$ver" ] || { echo "no wasm-bindgen entry in Cargo.lock"; exit 1; }
          echo "installing wasm-bindgen-cli $ver"
          cargo install wasm-bindgen-cli --version "$ver" --locked
      - name: wasm size gate
        run: ./scripts/wasm-size.sh
      - name: wasm size gate rejects an over-budget artifact
        # Must fail *for the budget reason*, not merely exit non-zero — otherwise a broken
        # pipeline (missing tool, empty artifact) would pass this negative test.
        run: |
          if out=$(WASM_BUDGET_BYTES=1 ./scripts/wasm-size.sh 2>&1); then
            echo "expected the gate to fail with a 1-byte budget"; echo "$out"; exit 1
          fi
          echo "$out" | grep -q "exceeds budget" || {
            echo "the gate failed, but not on the budget comparison:"; echo "$out"; exit 1
          }

  capi:
    name: capi (header + C smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: Install cbindgen (pinned; must match scripts/capi-header.sh)
        run: cargo install cbindgen --locked --version 0.29.4
      - name: Check doodle.h is current
        run: ./scripts/capi-header.sh
      - name: C smoke test
        run: ./scripts/capi-smoke.sh
