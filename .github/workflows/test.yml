name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `cargo test --workspace` on the three host platforms, plus a wasm32 build
# check.  The pinned toolchain -- channel, rustfmt/clippy components, and the
# wasm32-unknown-unknown target -- all come from rust-toolchain.toml: the warm
# step's argument-free `rustup toolchain install` reads that file and installs
# exactly what it declares, so nothing is pinned here.  Keeping the warm step a
# single argument-free command makes it behave identically under the default
# shells (bash on Linux/macOS, PowerShell on Windows).
#
# Node-executed wasm tests land with the JS facade at M3 (deferred per AD8). The
# `miri` job below (M7.6, D-M7-11) certifies doodle-capi's `unsafe` under a pinned
# nightly; the shipped build stays on the pinned stable in rust-toolchain.toml.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: cargo test
        run: cargo test --workspace

  wasm-check:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: cargo check (wasm32)
        run: cargo check --workspace --target wasm32-unknown-unknown

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: conformance runner
        run: cargo run --quiet --package conformance-runner

  wasm-size:
    name: wasm size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: Install binaryen and brotli
        run: sudo apt-get update && sudo apt-get install -y binaryen brotli
      - name: Install wasm-bindgen-cli (version matched to the crate)
        # Read the locked wasm-bindgen version from Cargo.lock so the CLI always
        # matches the crate (wasm-bindgen errors loudly on a version mismatch).
        run: |
          ver=$(awk '/^name = "wasm-bindgen"$/{f=1} f && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          [ -n "$ver" ] || { echo "no wasm-bindgen entry in Cargo.lock"; exit 1; }
          echo "installing wasm-bindgen-cli $ver"
          cargo install wasm-bindgen-cli --version "$ver" --locked
      - name: wasm size gate
        run: ./scripts/wasm-size.sh
      - name: wasm size gate rejects an over-budget artifact
        # Must fail *for the budget reason*, not merely exit non-zero — otherwise a broken
        # pipeline (missing tool, empty artifact) would pass this negative test.
        run: |
          if out=$(WASM_BUDGET_BYTES=1 ./scripts/wasm-size.sh 2>&1); then
            echo "expected the gate to fail with a 1-byte budget"; echo "$out"; exit 1
          fi
          echo "$out" | grep -q "exceeds budget" || {
            echo "the gate failed, but not on the budget comparison:"; echo "$out"; exit 1
          }

  capi:
    name: capi (header + C smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: Install cbindgen (pinned; must match scripts/capi-header.sh)
        run: cargo install cbindgen --locked --version 0.29.4
      - name: Check doodle.h is current
        run: ./scripts/capi-header.sh
      - name: C smoke test
        run: ./scripts/capi-smoke.sh

  # The cross-surface conformance gate through the C ABI (M7.5f): the example C host runs every
  # run/drive fixture and its transcript is compared to the canonical oracle, so the C surface stays
  # trace-identical to native/wasm.  Linux-only per D-M7-9 (the sanitizer/C-embedding scope).  No
  # cbindgen (this does not regenerate the header); `cc` is present on the ubuntu runner.
  capi-conformance:
    name: capi conformance (through the C ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      - name: Conformance through the C ABI
        run: ./scripts/capi-conformance.sh

  # Miri over the C ABI (D-M7-11): interprets doodle-capi's `unsafe` -- all of AD1's raw-pointer
  # marshalling, the callback trampoline, the cross-thread control, the handle guard -- to certify
  # no aliasing/use-after-free/provenance UB.  Miri needs nightly, so this installs a *pinned*
  # nightly with the `miri` component (must match scripts/miri.sh; bump the two in lockstep) -- the
  # shipped build stays on the pinned stable in rust-toolchain.toml, untouched.  Linux-only, matching
  # the sanitizer/C-embedding scope (D-M7-9).  The pinned nightly also means nightly churn can never
  # spontaneously break this gate.
  miri:
    name: miri (capi unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned nightly + miri (must match scripts/miri.sh)
        run: rustup toolchain install nightly-2026-09-05 --profile minimal --component miri
      - name: Miri over doodle-capi
        run: ./scripts/miri.sh

  # The sanitizer half of the D-M7-11 split (Miri covers the Rust side; this covers the C side):
  # builds the example C hosts with ASAN + UBSan + LeakSanitizer and runs them, so C-host memory
  # misuse / undefined behavior / leaked host resources abort the gate.  Linux-only per D-M7-9 --
  # LSAN is Linux-only, and this is the C-embedding scope.  `cc` (gcc) + libasan/libubsan are
  # preinstalled on the ubuntu runner.
  capi-sanitize:
    name: capi sanitize (ASAN/LSAN/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Warm toolchain
        run: rustup toolchain install
      # Newer kernels raise mmap randomness beyond what ASan's shadow mapping tolerates; lower it
      # so ASan can reserve its shadow region.  Best-effort: a no-op where it is already fine.
      - name: Lower ASLR entropy for AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: ASAN/LSAN/UBSan over the C hosts
        run: ./scripts/capi-sanitize.sh
